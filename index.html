<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
    background: #ffffff;
    color: #000000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: #ffffff;
    border: 2px solid #1abc9c;
    border-radius: 16px;
    padding: 40px 45px;
    max-width: 760px;
    width: 100%;
    box-shadow: 0 8px 30px rgba(26, 188, 156, 0.15);
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    color: #000;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  .subtitle {
    text-align: center;
    color: #1abc9c;
    font-size: 14px;
    margin-bottom: 30px;
    font-weight: 500;
  }

  .label {
    display: block;
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 10px;
    color: #000;
  }

  .select-wrapper {
    position: relative;
    margin-bottom: 25px;
  }

  select {
    width: 100%;
    padding: 14px 45px 14px 18px;
    font-family: inherit;
    font-size: 15px;
    color: #000;
    background: #ffffff;
    border: 2px solid #1abc9c;
    border-radius: 10px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    outline: none;
    transition: all 0.25s ease;
  }

  select:hover, select:focus {
    border-color: #16a085;
    box-shadow: 0 0 0 3px rgba(26, 188, 156, 0.15);
  }

  .select-wrapper::after {
    content: "▾";
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: #1abc9c;
    font-size: 18px;
    pointer-events: none;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    background: #1abc9c;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 0.3px;
  }

  .btn:hover {
    background: #16a085;
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(26, 188, 156, 0.35);
  }

  .btn:active {
    transform: translateY(0);
  }

  .result {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px dashed #1abc9c;
    min-height: 20px;
  }

  .result-title {
    font-size: 15px;
    font-weight: 600;
    color: #1abc9c;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .result-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .result-list li {
    background: #f4fbf9;
    border-left: 4px solid #1abc9c;
    padding: 14px 18px;
    border-radius: 6px;
    font-size: 14.5px;
    line-height: 1.55;
    color: #000;
    transition: all 0.2s ease;
  }

  .result-list li:hover {
    background: #e8f7f3;
    transform: translateX(3px);
  }

  .placeholder {
    text-align: center;
    color: #888;
    font-style: italic;
    font-size: 14px;
    padding: 10px;
  }

  @media (max-width: 560px) {
    .container { padding: 28px 22px; }
    h1 { font-size: 21px; }
  }
</style>

      "История нашего края. Чувашия, 5 класс. Захаров Д.А., Берман А.Г., Дьяконова Л.Г. и другие",
      "История нашего края. Чувашия, 6 класс. Гусаров Ю.В., Басманцев Д.В., Егоров Д.В. и другие",
      "История нашего края. Чувашия, 7 класс. Иванова Т.Н., Идрисов Р.А., Кодыбайкин С.Н. и другие"
    ]
  };

  // Сортировка регионов по алфавиту (с учётом русской локали)
  const sortedRegions = Object.keys(data).sort((a, b) => a.localeCompare(b, 'ru'));

  const select = document.getElementById('region');
  const btn = document.getElementById('findBtn');
  const result = document.getElementById('result');

  // Заполняем выпадающий список
  sortedRegions.forEach(region => {
    const opt = document.createElement('option');
    opt.value = region;
    opt.textContent = region;
    select.appendChild(opt);
  });

  // Обработка нажатия кнопки
  btn.addEventListener('click', () => {
    const chosen = select.value;
    result.innerHTML = '';

    if (!chosen) {
      result.innerHTML = '<p class="placeholder">Пожалуйста, выберите регион из списка</p>';
      return;
    }

    const books = data[chosen];
    let html = `<div class="result-title">Учебники для региона «${chosen}»</div>`;
    html += '<ul class="result-list">';
    books.forEach(book => {
      html += `<li>${book}</li>`;
    });
    html += '</ul>';
    result.innerHTML = html;
  });
</script>

</body>
</html>
